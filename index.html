<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Parama</title>
  <meta name="theme-color" content="#070912">
  <meta name="background-color" content="#060810">
  <meta name="application-name" content="Parama">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#060810;--blue:#3567ff;--violet:#8b3dff;--orange:#ff7428;--text:#f8fafc;--muted:#99a3b8}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;min-height:100dvh;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overscroll-behavior:none}
    #appFrame{position:fixed;inset:0;z-index:1;width:100%;height:100%;border:0;margin:0;padding:0;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .3s ease}
    #appFrame.ready{opacity:1;visibility:visible}
    #splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(53,103,255,.24),transparent 34%),radial-gradient(circle at 85% 88%,rgba(255,116,40,.18),transparent 36%),linear-gradient(160deg,#090b17 0%,#060810 48%,#10162a 100%);opacity:1;visibility:visible;transition:opacity .4s ease,visibility .4s ease}
    #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .ambient{position:absolute;border-radius:999px;filter:blur(16px);opacity:.55;pointer-events:none}
    .one{width:280px;height:280px;left:-140px;top:8%;background:rgba(53,103,255,.25);animation:drift1 6s ease-in-out infinite alternate}
    .two{width:240px;height:240px;right:-120px;bottom:6%;background:rgba(255,116,40,.18);animation:drift2 7s ease-in-out infinite alternate}
    @keyframes drift1{to{transform:translate(36px,28px) scale(1.08)}}
    @keyframes drift2{to{transform:translate(-30px,-24px) scale(1.1)}}
    .content{position:relative;z-index:2;width:min(100%,360px);text-align:center}
    .logo-stage{position:relative;width:150px;height:150px;margin:0 auto 28px;display:grid;place-items:center}
    .orbit{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
    .orbit:before{content:"";position:absolute;top:-4px;left:50%;width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--orange));box-shadow:0 0 18px rgba(139,61,255,.9);transform:translateX(-50%)}
    .outer{animation:rotate 5.5s linear infinite}.inner{inset:13px;border-color:rgba(255,255,255,.07);animation:rotateR 7s linear infinite}
    @keyframes rotate{to{transform:rotate(360deg)}} @keyframes rotateR{to{transform:rotate(-360deg)}}
    .logo-card{position:relative;width:108px;height:108px;overflow:hidden;border-radius:30px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);box-shadow:0 22px 60px rgba(0,0,0,.42),0 0 42px rgba(53,103,255,.2);animation:breathe 2.6s ease-in-out infinite}
    .logo-card img{width:100%;height:100%;display:block;object-fit:cover}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
    h1{margin:0;font-size:clamp(32px,9vw,42px);line-height:1;font-weight:850;letter-spacing:.03em}
    .tagline{margin:10px 0 0;color:#b7becb;font-size:14px;letter-spacing:.02em}
    .loading-box{margin-top:44px}.loading-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px;color:#cbd5e1;font-size:12px}
    #loadingText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}#loadingPercent{min-width:34px;text-align:right;font-weight:700}
    .progress-track{width:100%;height:7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
    #progressBar{width:8%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3567ff,#8b3dff 56%,#ff7428);box-shadow:0 0 18px rgba(139,61,255,.44);transition:width .42s cubic-bezier(.2,.8,.2,1)}
    .secure-note{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;color:#7f899a;font-size:11px}.secure-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.65)}
    #offlineNotice{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;display:none;width:min(calc(100% - 32px),420px);padding:12px 15px;border:1px solid rgba(248,113,113,.25);border-radius:14px;background:rgba(69,10,10,.94);color:#fecaca;text-align:center;font-size:13px;transform:translateX(-50%);backdrop-filter:blur(12px)}
  </style>
</head>
<body>
  <section id="splash" aria-label="Memuat Parama">
    <div class="ambient one"></div><div class="ambient two"></div>
    <div class="content">
      <div class="logo-stage" aria-hidden="true"><div class="orbit outer"></div><div class="orbit inner"></div><div class="logo-card"><img src="./icon-192.png" alt=""></div></div>
      <h1>Parama</h1><p class="tagline">Closing Operations</p>
      <div class="loading-box">
        <div class="loading-row"><span id="loadingText">Menyiapkan aplikasi...</span><span id="loadingPercent">8%</span></div>
        <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
        <div class="secure-note"><span class="secure-dot"></span><span>Koneksi aman ke database Parama</span></div>
      </div>
    </div>
  </section>

  <div id="offlineNotice">Tidak ada koneksi internet. Sambungkan perangkat lalu buka ulang aplikasi.</div>
  <iframe id="appFrame" title="Parama" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script>
    const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbySKs1PIa9x5dw_2UoxhsarWSTVOxd6-atqdqPzB_O7LoTaStxoTpI9tr_oHHelgcZk/exec';
    const MIN_SPLASH_TIME=850;
    const READY_TIMEOUT=20000;
    const splash=document.getElementById('splash');
    const appFrame=document.getElementById('appFrame');
    const progressBar=document.getElementById('progressBar');
    const loadingText=document.getElementById('loadingText');
    const loadingPercent=document.getElementById('loadingPercent');
    const offlineNotice=document.getElementById('offlineNotice');
    const steps=[
      {delay:120,progress:18,text:'Menyiapkan aplikasi...'},
      {delay:520,progress:38,text:'Menghubungkan ke Parama...'},
      {delay:980,progress:61,text:'Menyinkronkan data stok...'},
      {delay:1450,progress:82,text:'Menyiapkan halaman closing...'}
    ];
    let startedAt=performance.now();
    let frameLoaded=false;
    let readyTimeoutId=null;

    document.addEventListener('DOMContentLoaded',initializeApp);
    window.addEventListener('online',updateConnectionState);
    window.addEventListener('offline',updateConnectionState);
    window.addEventListener('message',function(event){
      if(event&&event.data&&(event.data.type==='PARAMA_APP_READY'||event.data.type==='SANTARA_APP_READY')) revealApp(true);
    });

    function initializeApp(){
      startedAt=performance.now();
      updateConnectionState();
      registerServiceWorker();
      steps.forEach(function(step){setTimeout(function(){if(!frameLoaded)setProgress(step.progress,step.text)},step.delay)});
      appFrame.addEventListener('load',function(){frameLoaded=true;setProgress(94,'Parama siap dibuka...');setTimeout(function(){revealApp(false)},120)}, {once:true});
      readyTimeoutId=setTimeout(function(){revealApp(false)},READY_TIMEOUT);
      appFrame.src=APPS_SCRIPT_URL;
    }

    function setProgress(value,text){const v=Math.max(0,Math.min(100,value));progressBar.style.width=v+'%';loadingPercent.textContent=v+'%';if(text)loadingText.textContent=text}
    function revealApp(){
      if(readyTimeoutId){clearTimeout(readyTimeoutId);readyTimeoutId=null}
      setProgress(100,'Parama siap digunakan');
      const elapsed=performance.now()-startedAt;
      const wait=Math.max(160,MIN_SPLASH_TIME-elapsed);
      setTimeout(function(){appFrame.classList.add('ready');splash.classList.add('hide')},wait);
    }
    function updateConnectionState(){offlineNotice.style.display=navigator.onLine?'none':'block'}
    function registerServiceWorker(){
      if(!('serviceWorker' in navigator))return;
      window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(error){console.error('Service worker gagal didaftarkan:',error)})});
    }
  </script>
</body>
</html>
